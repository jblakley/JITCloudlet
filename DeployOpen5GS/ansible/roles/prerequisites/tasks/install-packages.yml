---
- name: Install pip package
  when: ansible_distribution != "MacOSX"
  become: yes
  apt:
    update_cache: yes
    name: python3-pip

- name: Install crypto python packages
  become: yes
  pip:
    name:
      - cryptography
      - pyopenssl
    extra_args: --ignore-installed

- name: Install other pip packages   
  become: yes
  pip:
    name:
      - tqdm
      - jinja2
      - python-dotenv
      - numpy
      - pandas
      




